# Local defaults for the SDP observation control system.
# Values can be overridden for a Kubernetes deployment or in tests.

app:
  name: ska-sdp-long-observation
  environment: local

storage:
  data_dir: ./data
  failed_dir: ./data_failed  # quality-gate-exhausted .ms dirs are moved here, excluded from the storage_threshold_mb count
  storage_threshold_mb: 5120  # 5 GiB
  count_scope: ms_only  # "ms_only" (raw .ms dirs only) or "all" (everything under data_dir)

observation:
  receive_interval_seconds: 60
  retry_attempts: 20
  retry_delay_seconds: 10
  storage_wait_indefinite: true  # poll forever when storage is full; false caps it at retry_attempts
  storage_wait_safety_limit: 1000  # hard ceiling on wait-retries even when storage_wait_indefinite is true

processing:
  max_concurrency: 5
  command_timeout_seconds: 3600

containers:
  runner: docker
  receive:
    image: docker.io/pw410/ska-sdp-mock:0.1
    command: ["/scripts/generate_visibilities.sh"]
  process:
    image: docker.io/pw410/ska-sdp-mock:0.1
    command: ["/scripts/process_visibilities.sh"]
  volume_name: ska-sdp-data
  mount_path: /data

quality_gate:
  enabled: true
  outcomes:
    - Continue
    - Reprocess
  max_attempts: 2

kubernetes:
  namespace: default
  pvc_name: ska-sdp-data
  image_pull_policy: IfNotPresent
  active_deadline_seconds: 3600

logging:
  level: INFO
